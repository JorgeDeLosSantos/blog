---
layout: default
---

<article class="post-content">
  <header class="post-header" style="margin-bottom: 30px;">
    <h1 style="font-size: 2.5em; margin-bottom: 10px;">{{ page.title }}</h1>
    
    <div class="post-meta" style="color: #666; margin-bottom: 15px;">
      <time style="margin-right: 15px;">{{ page.date | date: "%d/%m/%Y" }}</time>
      
      <!-- Bloque para mostrar las etiquetas -->
      <!-- Bloque actualizado para enlazar las etiquetas -->
      {% if page.tags and page.tags.size > 0 %}
        <span class="post-tags" style="font-size: 0.9em;">
          | Etiqueta{% if page.tags.size > 1 %}s{% endif %}:
          {% for tag in page.tags %}
            <a href="{{ '/tags/' | relative_url }}#{{ tag | slugify }}" style="background: #eee; padding: 2px 8px; border-radius: 3px; margin-left: 5px; color: #444; text-decoration: none; display: inline-block;">
              {{ tag }}
            </a>
          {% endfor %}
        </span>
      {% endif %}
    </div>
  </header>

  <div class="entry-content">
    {{ content }}
  </div>
</article>

<nav class="post-navigation" style="margin-top: 50px; border-top: 1px solid #eee; padding-top: 20px;">
  <a href="{{ site.baseurl }}/" class="back-link" style="text-decoration: none; font-weight: bold; color: #2a7ae2;">
    ← Volver a la página principal
  </a>
</nav>
