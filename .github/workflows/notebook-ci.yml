name: Notebook CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  notebook-tests:
    name: Notebook tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-notebooks.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-notebooks.txt

      - name: Check Python syntax
        run: python -m compileall -q scripts tests

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Smoke-test notebook conversion
        run: python scripts/build_posts.py notebooks/2026-11-08-newton-raphson.ipynb
